# TOS platform nginx include — serves the static DrawDB ER-diagram editor
# for the floating window (iframe mode, config.ini path=/drawdb/).
# Pure static SPA (BrowserRouter): the fallback keeps deep links working.
# The dist was built with vite --base=/drawdb/ so all asset URLs are
# subpath-safe; monaco/icon fonts/pdfobject are bundled locally.
location /drawdb/ {
    alias /usr/local/drawdb/webui/;
    index index.html;
    try_files $uri $uri/ /drawdb/index.html;
}
